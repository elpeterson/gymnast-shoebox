name: Supabase Backup

on:
  schedule:
    # Weekly on Sunday at 09:30 UTC.
    - cron: "30 9 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Dump Supabase database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"

          mkdir -p backups
          pg_dump \
            "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backups/gymnast-shoebox-$(date -u +%Y%m%dT%H%M%SZ).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 90
